name: Deploy release workshop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to deploy, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-workshop-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package tagged workshop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Confirm stable tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/verify-release-tag.js
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload exact tested web build
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish workshop to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read configured Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
