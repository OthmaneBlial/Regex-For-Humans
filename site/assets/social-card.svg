<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Regex For Humans — Regex you can read like a map.</title>
  <desc id="description">The rules start, "#", 6 hex digits and end drawn as stations on one transit line, each with its regex fragment, above the compiled JavaScript regex for a hex color.</desc>
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="300" height="12" fill="#d0291c" />
  <rect x="300" width="300" height="12" fill="#0a5bb5" />
  <rect x="600" width="300" height="12" fill="#18803f" />
  <rect x="900" width="300" height="12" fill="#f0a500" />
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#121820">
    <rect x="72" y="66" width="34" height="18" rx="9" fill="#d0291c" />
    <circle cx="80" cy="75" r="13" fill="#ffffff" stroke="#121820" stroke-width="6" />
    <text x="122" y="84" font-size="26" font-weight="500">Regex <tspan font-weight="800">For Humans</tspan></text>
    <text x="1128" y="84" font-size="24" font-weight="600" fill="#48505d" text-anchor="end">Words in. Regex out.</text>
    <text x="72" y="196" font-size="76" font-weight="800" letter-spacing="-2.5">Regex you can read</text>
    <text x="72" y="276" font-size="76" font-weight="800" letter-spacing="-2.5">like a map.</text>
    <text x="134" y="372" font-size="26" font-weight="700" text-anchor="middle">start</text>
    <text x="420" y="372" font-size="26" font-weight="700" text-anchor="middle">"#"</text>
    <text x="760" y="372" font-size="26" font-weight="700" text-anchor="middle">6 hex digits</text>
    <text x="1066" y="372" font-size="26" font-weight="700" text-anchor="middle">end</text>
  </g>
  <rect x="134" y="404" width="456" height="14" fill="#d0291c" />
  <rect x="590" y="404" width="476" height="14" fill="#0a5bb5" />
  <path d="M722 411v20a20 20 0 0 0 20 20h36a20 20 0 0 0 20-20v-20" fill="none" stroke="#18803f" stroke-width="8" />
  <rect x="126" y="384" width="16" height="54" rx="6" fill="#121820" />
  <rect x="1058" y="384" width="16" height="54" rx="6" fill="#121820" />
  <circle cx="420" cy="411" r="17" fill="#d0291c" stroke="#121820" stroke-width="7" />
  <circle cx="760" cy="411" r="17" fill="#0a5bb5" stroke="#121820" stroke-width="7" />
  <g font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700" text-anchor="middle">
    <text x="134" y="482" fill="#121820">^</text>
    <text x="420" y="482" fill="#d0291c">#</text>
    <text x="760" y="490" fill="#0a5bb5">[0-9A-Fa-f]{6}</text>
    <text x="1066" y="482" fill="#121820">$</text>
  </g>
  <rect x="72" y="530" width="520" height="64" rx="12" fill="#121820" />
  <text x="98" y="571" fill="#ffc23d" font-family="Menlo, Consolas, monospace" font-size="27" font-weight="700">/^#[0-9A-Fa-f]{6}$/u</text>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="624" y="538" width="178" height="48" rx="24" fill="#ffffff" stroke="#18803f" stroke-width="3" />
    <text x="646" y="570" fill="#121820">✓ #12aBcF</text>
    <rect x="818" y="538" width="138" height="48" rx="24" fill="#ffffff" stroke="#d0291c" stroke-width="3" />
    <text x="840" y="570" fill="#121820">× #123</text>
  </g>
</svg>
