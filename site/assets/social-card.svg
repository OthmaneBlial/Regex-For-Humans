<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Regex For Humans</title>
<desc id="desc">The rules start, "#", 6 hex digits, end compile to the JavaScript regex ^#[0-9A-Fa-f]{6}$. Under each fragment is its meaning in plain English and the part of #ff6b6b it matches.</desc>
<style>
.paper{fill:#fff}.edge{fill:none;stroke:#15171c;stroke-width:2}.ink{fill:#15171c}.ink2{fill:#4b505b}.ink3{fill:#6b707b}
.blue{fill:#2337c6}.wash{fill:#eceffd}.brace{fill:none;stroke:#2337c6;stroke-width:1.5}.span{fill:none;stroke:#6b707b;stroke-width:1}
.sc{letter-spacing:.08em}
@media (prefers-color-scheme:dark){.paper{fill:#111317}.edge{stroke:#eceef2}.ink{fill:#eceef2}.ink2{fill:#b4b9c4}.ink3{fill:#9096a2}
.blue{fill:#93a3ff}.wash{fill:#1c2142}.brace{stroke:#93a3ff}.span{stroke:#9096a2}}
</style>
<rect class="paper" width="1200" height="630" rx="20"/>
<rect class="edge" x="1" y="1" width="1198" height="628" rx="19"/>
<text x="64" y="116" font-size="64" font-weight="600" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">Regex <tspan font-style="italic" font-weight="400">for</tspan> Humans</text>
<text x="64" y="161.9" font-size="27" class="ink2" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">Write regex in plain English. <tspan font-style="italic">Read any regex the same way.</tspan></text>
<text x="64" y="250" font-size="20" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">start &quot;#&quot;   ·   6 hex digits   ·   end</text>
<text x="1136" y="250" font-size="18" text-anchor="end" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">compile() ↓   ↑ regexToRules()</text>
<line x1="64" x2="1136" y1="272" y2="272" class="span"/>
<g transform="translate(190.8 300) scale(1.000)">
<text x="23.6" y="66.0" font-size="66.0" textLength="39.6" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">^</text>
<path class="brace" d="M23.6 79.8 V85.8 H63.2 V79.8"/>
<text x="43.4" y="133.4" font-size="21.84" text-anchor="middle" class="ink2 sc" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">START</text>
<text x="115.7" y="66.0" font-size="66.0" textLength="39.6" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">#</text>
<path class="brace" d="M115.7 79.8 V85.8 H155.3 V79.8"/>
<text x="135.5" y="133.4" font-size="28" text-anchor="middle" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">&quot;#&quot;</text>
<rect class="wash" x="114.2" y="170.5" width="42.6" height="43.4" rx="3"/>
<text x="135.5" y="201.3" font-size="28" text-anchor="middle" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">#</text>
<text x="184.2" y="66.0" font-size="66.0" textLength="554.4" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">[0-9A-Fa-f]{6}</text>
<path class="brace" d="M184.2 79.8 V85.8 H738.6 V79.8"/>
<text x="461.4" y="133.4" font-size="28" text-anchor="middle" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">6 hex digits</text>
<rect class="wash" x="396.8" y="170.5" width="129.4" height="43.4" rx="3"/>
<text x="461.4" y="201.3" font-size="28" text-anchor="middle" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ff6b6b</text>
<text x="772.6" y="66.0" font-size="66.0" textLength="39.6" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">$</text>
<path class="brace" d="M772.6 79.8 V85.8 H812.2 V79.8"/>
<text x="792.4" y="133.4" font-size="21.84" text-anchor="middle" class="ink2 sc" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">END</text>
</g>
</svg>
