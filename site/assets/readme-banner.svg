<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Regex For Humans</title>
  <desc id="desc">The rules start, "#", 6 hex digits and end drawn as stations on one transit line, each above its regex fragment, with the compiled JavaScript regex for a hex color.</desc>
  <clipPath id="plate"><rect width="1200" height="460" rx="24" /></clipPath>
  <rect width="1200" height="460" rx="24" fill="#ffffff" />
  <rect x="2" y="2" width="1196" height="456" rx="23" fill="none" stroke="#121820" stroke-width="4" />
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#121820">
    <text x="64" y="104" font-size="58" font-weight="800" letter-spacing="-2">Regex you can read like a map.</text>
    <text x="64" y="148" font-size="24" font-weight="500" fill="#48505d">Plain English rules in, native JavaScript regex out. And back.</text>
    <text x="126" y="228" font-size="24" font-weight="700" text-anchor="middle">start</text>
    <text x="400" y="228" font-size="24" font-weight="700" text-anchor="middle">"#"</text>
    <text x="740" y="228" font-size="24" font-weight="700" text-anchor="middle">6 hex digits</text>
    <text x="1074" y="228" font-size="24" font-weight="700" text-anchor="middle">end</text>
  </g>
  <rect x="126" y="258" width="444" height="12" fill="#d0291c" />
  <rect x="570" y="258" width="504" height="12" fill="#0a5bb5" />
  <path d="M704 264v18a18 18 0 0 0 18 18h36a18 18 0 0 0 18-18v-18" fill="none" stroke="#18803f" stroke-width="7" />
  <rect x="118" y="240" width="16" height="48" rx="6" fill="#121820" />
  <rect x="1066" y="240" width="16" height="48" rx="6" fill="#121820" />
  <circle cx="400" cy="264" r="15" fill="#d0291c" stroke="#121820" stroke-width="6" />
  <circle cx="740" cy="264" r="15" fill="#0a5bb5" stroke="#121820" stroke-width="6" />
  <g font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <text x="126" y="336" fill="#121820">^</text>
    <text x="400" y="336" fill="#d0291c">#</text>
    <text x="740" y="340" fill="#0a5bb5">[0-9A-Fa-f]{6}</text>
    <text x="1074" y="336" fill="#121820">$</text>
  </g>
  <rect x="64" y="370" width="440" height="56" rx="10" fill="#121820" />
  <text x="86" y="406" fill="#ffc23d" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">/^#[0-9A-Fa-f]{6}$/u</text>
  <g clip-path="url(#plate)">
    <rect x="0" y="448" width="300" height="12" fill="#d0291c" />
    <rect x="300" y="448" width="300" height="12" fill="#0a5bb5" />
    <rect x="600" y="448" width="300" height="12" fill="#18803f" />
    <rect x="900" y="448" width="300" height="12" fill="#f0a500" />
  </g>
</svg>
