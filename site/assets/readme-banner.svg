<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Regex For Humans</title>
<desc id="desc">The rules start, "#", 6 hex digits, end compile to the JavaScript regex ^#[0-9A-Fa-f]{6}$. Under each fragment is its meaning in plain English and the part of #ff6b6b it matches.</desc>
<style>
.paper{fill:#fff}.edge{fill:none;stroke:#15171c;stroke-width:2}.ink{fill:#15171c}.ink2{fill:#4b505b}.ink3{fill:#6b707b}
.blue{fill:#2337c6}.wash{fill:#eceffd}.brace{fill:none;stroke:#2337c6;stroke-width:1.5}.span{fill:none;stroke:#6b707b;stroke-width:1}
.sc{letter-spacing:.08em}
@media (prefers-color-scheme:dark){.paper{fill:#111317}.edge{stroke:#eceef2}.ink{fill:#eceef2}.ink2{fill:#b4b9c4}.ink3{fill:#9096a2}
.blue{fill:#93a3ff}.wash{fill:#1c2142}.brace{stroke:#93a3ff}.span{stroke:#9096a2}}
</style>
<rect class="paper" width="1200" height="470" rx="20"/>
<rect class="edge" x="1" y="1" width="1198" height="468" rx="19"/>
<text x="64" y="92" font-size="50" font-weight="600" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">Regex <tspan font-style="italic" font-weight="400">for</tspan> Humans</text>
<text x="64" y="129.4" font-size="22" class="ink2" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">Write regex in plain English. <tspan font-style="italic">Read any regex the same way.</tspan></text>
<text x="64" y="196" font-size="18" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">start &quot;#&quot;   ·   6 hex digits   ·   end</text>
<text x="1136" y="196" font-size="16.2" text-anchor="end" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">compile() ↓   ↑ regexToRules()</text>
<line x1="64" x2="1136" y1="218" y2="218" class="span"/>
<g transform="translate(264.9 236) scale(1.000)">
<text x="19.4" y="54.0" font-size="54.0" textLength="32.4" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">^</text>
<path class="brace" d="M19.4 64.2 V70.2 H51.8 V64.2"/>
<text x="35.6" y="109.3" font-size="17.94" text-anchor="middle" class="ink2 sc" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">START</text>
<text x="95.0" y="54.0" font-size="54.0" textLength="32.4" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">#</text>
<path class="brace" d="M95.0 64.2 V70.2 H127.4 V64.2"/>
<text x="111.2" y="109.3" font-size="23" text-anchor="middle" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">&quot;#&quot;</text>
<rect class="wash" x="93.7" y="139.7" width="35.0" height="35.6" rx="3"/>
<text x="111.2" y="165.0" font-size="23" text-anchor="middle" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">#</text>
<text x="151.2" y="54.0" font-size="54.0" textLength="453.6" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">[0-9A-Fa-f]{6}</text>
<path class="brace" d="M151.2 64.2 V70.2 H604.8 V64.2"/>
<text x="378.0" y="109.3" font-size="23" text-anchor="middle" class="ink" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">6 hex digits</text>
<rect class="wash" x="324.8" y="139.7" width="106.3" height="35.6" rx="3"/>
<text x="378.0" y="165.0" font-size="23" text-anchor="middle" class="blue" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ff6b6b</text>
<text x="632.6" y="54.0" font-size="54.0" textLength="32.4" lengthAdjust="spacingAndGlyphs" class="ink" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">$</text>
<path class="brace" d="M632.6 64.2 V70.2 H665.0 V64.2"/>
<text x="648.8" y="109.3" font-size="17.94" text-anchor="middle" class="ink2 sc" font-family="Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif">END</text>
</g>
</svg>
